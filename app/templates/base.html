<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Tripzy{% endblock %} · Tripzy</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/dashboard' if user else '/login' }}">Tripzy</a>
      {% if user %}
      <nav aria-label="Main">
        <ul class="nav-links">
          <li><a href="/dashboard" {% if nav == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a></li>
          <li><a href="/trips" {% if nav == 'trips' %}aria-current="page"{% endif %}>Trips</a></li>
          <li><a href="/friends" {% if nav == 'friends' %}aria-current="page"{% endif %}>Friends</a></li>
          <li><a href="/groups" {% if nav == 'groups' %}aria-current="page"{% endif %}>Groups</a></li>
          <li><a href="/account" {% if nav == 'account' %}aria-current="page"{% endif %}>{{ user.display_name }}</a></li>
          <li><button type="button" class="btn-link" id="logout-btn">Log out</button></li>
        </ul>
      </nav>
      {% endif %}
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script>window.TRIPZY = {{ {"userId": user.id if user else None} | tojson }};</script>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
